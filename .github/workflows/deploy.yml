name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a maintainer publish a fork or a branch without touching main.
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race. In-progress runs are cancelled so the newest commit wins.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build and publish to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Export the static site into out/
        # The app is fully client-side, so these two values are baked into the
        # published JavaScript. They are the public/publishable keys only; never
        # expose the service-role key here.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # A project site is published at https://<user>.github.io/<repo>/, so
          # assets must be requested from that prefix. Leave empty for a user site.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: npm run build

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # Keep one published copy so the branch history stays readable.
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy ${{ github.sha }}'